# Every suite here runs on the deterministic reasoner, so CI needs no API key
# and costs nothing. The model-backed paths are verified separately with
# scripts/check_provider.py, which does need credentials.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RESTORIO_PROVIDER: offline
      RESTORIO_AUTONOMY: full
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pytest

      - name: Unit tests (guardrails, ground-truth isolation, invariants)
        run: python -m pytest backend/tests -v

      - name: Acceptance tests (10 scenarios, 4 fault classes)
        run: python scripts/acceptance.py

      - name: Held-out tests (5 unseen scenarios x 3 seeds)
        run: python scripts/heldout.py

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
